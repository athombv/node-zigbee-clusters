# Categories for the notes GitHub generates when the deploy workflow creates a release.
# The labels are set from the conventional-commit prefix of the pull request title by
# .github/workflows/label-pr.yml.
changelog:
  exclude:
    labels:
      - internal
      - release
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: New features
      labels:
        - feature
    - title: Fixes
      labels:
        - fix
    # Titles without a conventional prefix, typically outside contributions. Retitle the pull
    # request to move it.
    - title: Other changes
      labels:
        - '*'
